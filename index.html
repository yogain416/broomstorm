<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빗자루 폭풍 (Broomstorm)</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1b1b1f; --muted:#5b5b66; --accent:#6b4fbb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15151a; --fg:#e8e8ee; --muted:#a0a0ad; --accent:#a992f0; }
  }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--fg);
    font:16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Roboto, sans-serif;
  }
  main { max-width:480px; padding:40px 24px; }
  h1 { font-size:1.5rem; margin:0 0 6px; }
  p { color:var(--muted); margin:0 0 24px; }
  a { color:var(--accent); }
  ul { padding-left:20px; margin:0; }
  li { margin:8px 0; }
</style>
</head>
<body>
<main>
  <h1>빗자루 폭풍 <span style="color:var(--muted);font-weight:400">/ Broomstorm</span></h1>
  <p>부싶개 (boosipgae)</p>
  <ul>
    <li><a href="./privacy/">개인정보 처리방침 · Privacy Policy</a></li>
  </ul>
</main>
</body>
</html>
